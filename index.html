<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/iris-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林间初见，难忘夏光</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  </head>
  <body>
    <script>
      // SPA 子路由恢复：404.html 跳转过来后恢复原始路径
      (function() {
        var r = sessionStorage.getItem('r');
        if (r) { sessionStorage.removeItem('r'); history.replaceState(null, '', r); }
      })();
    </script>
    <div id="app"></div>

    <!-- ⚠️ 加载页必须放在 #app **外面**：
         Vue 的 app.mount('#app') 会清空容器内容，放里面的话加载页在挂载那一刻
         就被抹掉了（淡出根本没机会跑），后面等路由 chunk 的那段就是白屏。 -->
    <div id="loader">
        <style>
          #loader {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #f5f7f3;
            z-index: 9999;
            transition: opacity 0.4s ease;
          }
          #loader.hide { opacity: 0; pointer-events: none; }
          /* 开屏：Q 版头像 + 外圈进度环。
             图在 public/loader-lite.webp（原 GIF 592KB → 36.5KB，10 帧 / 1s 循环）。 */
          #loader .loader-badge {
            position: relative;
            width: 100px; height: 100px;
          }
          #loader .loader-badge img {
            width: 100px; height: 100px;
            border-radius: 50%;
            display: block;
          }
          #loader .loader-badge::after {
            content: '';
            position: absolute; inset: -8px;
            border-radius: 50%;
            border: 3px solid rgba(111, 66, 193, 0.16);
            border-top-color: #6f42c1;
            animation: loader-spin 0.9s linear infinite;
          }
          @keyframes loader-spin { to { transform: rotate(360deg); } }
          #loader p {
            margin-top: 20px;
            /* 打字时句子长度一直在变，留个高度免得下方元素跟着跳 */
            min-height: 1.3em;
            font-size: 0.85rem; color: rgba(0,0,0,0.3);
            letter-spacing: 4px;
          }
          /* 打字光标 */
          #loader p::after {
            content: '|';
            margin-left: 3px;
            opacity: .45;
            animation: caret-blink 1s steps(1) infinite;
          }
          @keyframes caret-blink { 50% { opacity: 0; } }
          /* 尊重系统的"减弱动态"：环不转，动画图也停 */
          @media (prefers-reduced-motion: reduce) {
            #loader .loader-badge::after { animation: none; }
            #loader p::after { animation: none; }
          }
        </style>
        <div class="loader-badge">
          <img src="/loader-lite.webp" alt="" width="100" height="100" />
        </div>
        <p id="loader-text"></p>
        <script>
          // 加载页那句文案：打字循环 —— 打完停 1s → 清空 → 打下一句，来回循环。
          // 放在这里（而不是 main.js）是因为加载页要在 Vue 启动**之前**就动起来。
          (function () {
            var el = document.getElementById('loader-text')
            if (!el) return

            var LINES = ['林间初见', '写下随想 · 记下笔记 · 分享生活']
            var TYPE_MS = 70    // 每个字（别调太大：加载页活得短，否则第二句根本打不完）
            var HOLD_MS = 1000  // 打完停多久

            // 尊重"减弱动态"：不逐字打，直接显示信息量最大的那句（介绍）
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
              el.textContent = LINES[LINES.length - 1]
              return
            }

            var li = 0
            var ci = 0
            function step() {
              if (!el.isConnected) return // 加载页已被移除，停掉计时器
              var line = LINES[li]
              if (ci < line.length) {
                el.textContent = line.slice(0, ++ci)
                setTimeout(step, TYPE_MS)
              } else {
                li = (li + 1) % LINES.length
                ci = 0
                setTimeout(function () {
                  el.textContent = ''
                  step()
                }, HOLD_MS)
              }
            }
            step()
          })()
        </script>
      </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
