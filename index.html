<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/iris-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林间初见，难忘夏光</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  </head>
  <body>
    <script>
      // SPA 子路由恢复：404.html 跳转过来后恢复原始路径
      (function() {
        var r = sessionStorage.getItem('r');
        if (r) { sessionStorage.removeItem('r'); history.replaceState(null, '', r); }
      })();
    </script>
    <div id="app"></div>

    <!-- ⚠️ 加载页必须放在 #app **外面**：
         Vue 的 app.mount('#app') 会清空容器内容，放里面的话加载页在挂载那一刻
         就被抹掉了（淡出根本没机会跑），后面等路由 chunk 的那段就是白屏。 -->
    <div id="loader">
        <style>
          #loader {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #f5f7f3;
            z-index: 9999;
            transition: opacity 0.4s ease;
          }
          #loader.hide { opacity: 0; pointer-events: none; }
          /* 开屏：Q 版头像 + 外圈进度环。
             图在 public/loader-lite.webp（原 GIF 592KB → 36.5KB，10 帧 / 1s 循环）。 */
          #loader .loader-badge {
            position: relative;
            width: 100px; height: 100px;
          }
          #loader .loader-badge img {
            width: 100px; height: 100px;
            border-radius: 50%;
            display: block;
          }
          #loader .loader-badge::after {
            content: '';
            position: absolute; inset: -8px;
            border-radius: 50%;
            border: 3px solid rgba(111, 66, 193, 0.16);
            border-top-color: #6f42c1;
            animation: loader-spin 0.9s linear infinite;
          }
          @keyframes loader-spin { to { transform: rotate(360deg); } }
          #loader p {
            margin-top: 20px;
            font-size: 0.85rem; color: rgba(0,0,0,0.3);
            letter-spacing: 4px;
          }
          /* 尊重系统的"减弱动态"：环不转，动画图也停 */
          @media (prefers-reduced-motion: reduce) {
            #loader .loader-badge::after { animation: none; }
          }
        </style>
        <div class="loader-badge">
          <img src="/loader-lite.webp" alt="" width="100" height="100" />
        </div>
        <p>林间初见</p>
      </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
